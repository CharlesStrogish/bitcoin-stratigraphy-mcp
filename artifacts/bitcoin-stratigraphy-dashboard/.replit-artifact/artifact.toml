kind = "data-app"
previewPath = "/"
title = "Bitcoin Stratigraphy Dashboard"
description = "An interactive explorer for a 422-day Bitcoin price-prediction video series, with searchable titles, day-by-day timeline views, multiple analysis, and linked video details."
version = "1.0.0"
id = "artifacts/bitcoin-stratigraphy-dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20948

[services.development]
run = "pnpm --filter @workspace/bitcoin-stratigraphy-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bitcoin-stratigraphy-dashboard", "run", "build" ]
[services.production.run]
args = [ "node", "artifacts/bitcoin-stratigraphy-dashboard/server.mjs" ]

[services.production.run.env]
NODE_ENV = "production"
PORT = "20948"
BASE_PATH = "/"

[services.production.health.startup]
path = "/"

[[services.production.rewrites]]
from = "/enterprise"
to = "/enterprise/index.html"

[[services.production.rewrites]]
from = "/enterprise/"
to = "/enterprise/index.html"

[[services.production.rewrites]]
from = "/whitepaper"
to = "/whitepaper/index.html"

[[services.production.rewrites]]
from = "/whitepaper/"
to = "/whitepaper/index.html"

[[services.production.rewrites]]
from = "/compliance"
to = "/compliance/index.html"

[[services.production.rewrites]]
from = "/compliance/"
to = "/compliance/index.html"

[[services.production.rewrites]]
from = "/simulator"
to = "/simulator/index.html"

[[services.production.rewrites]]
from = "/simulator/"
to = "/simulator/index.html"

[[services.production.rewrites]]
from = "/standard"
to = "/standard/index.html"

[[services.production.rewrites]]
from = "/standard/"
to = "/standard/index.html"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[[services.production.responseHeaders]]
path = "/*"
name = "X-Content-Type-Options"
value = "nosniff"

[[services.production.responseHeaders]]
path = "/*"
name = "Referrer-Policy"
value = "strict-origin-when-cross-origin"

[[services.production.responseHeaders]]
path = "/llms.txt"
name = "Access-Control-Allow-Origin"
value = "*"

[[services.production.responseHeaders]]
path = "/llms-full.txt"
name = "Access-Control-Allow-Origin"
value = "*"

[services.env]
PORT = "20948"
BASE_PATH = "/"
