openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: stratigraphy
    description: Bitcoin stratigraphy dataset
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/stratigraphy/sample:
    get:
      operationId: getStratigraphy
      tags: [stratigraphy]
      summary: Get the free five-record sample
      responses:
        "200":
          description: Latest five stratigraphy records
          content:
            application/json:
              schema:
                type: array
                minItems: 5
                maxItems: 5
                items:
                  $ref: "#/components/schemas/StratigraphyEntry"
  /v1/stratigraphy:
    get:
      operationId: getPaidStratigraphy
      tags: [stratigraphy]
      summary: Get the complete L402-protected dataset
      description: Without valid payment proof, creates a 21-satoshi Lightning invoice and returns an L402 challenge.
      security:
        - L402: []
      responses:
        "200":
          description: Complete stratigraphy dataset after payment
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StratigraphyEntry"
        "402":
          description: Lightning payment required
          headers:
            WWW-Authenticate:
              description: L402 challenge containing the payment hash and BOLT11 invoice
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/L402Challenge"
components:
  securitySchemes:
    L402:
      type: apiKey
      in: header
      name: Authorization
      description: "L402 <payment_hash>:<preimage>"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    StratigraphyEntry:
      type: object
      properties:
        day:
          type: integer
        title:
          type: string
        video_id:
          type: string
        transcript_summary:
          type: string
      required:
        - day
        - title
        - video_id
        - transcript_summary
    L402Challenge:
      type: object
      properties:
        invoice:
          type: string
          description: BOLT11 invoice
        payment_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
      required:
        - invoice
        - payment_hash

