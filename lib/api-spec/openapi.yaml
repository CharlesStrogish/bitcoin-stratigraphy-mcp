openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: stratigraphy
    description: Bitcoin stratigraphy dataset
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/stratigraphy/sample:
    get:
      operationId: getStratigraphy
      tags: [stratigraphy]
      summary: Get the free five-record sample
      responses:
        "200":
          description: Latest five stratigraphy records
          content:
            application/json:
              schema:
                type: array
                minItems: 5
                maxItems: 5
                items:
                  $ref: "#/components/schemas/StratigraphyEntry"
  /v1/stratigraphy:
    get:
      operationId: getPaidStratigraphy
      tags: [stratigraphy]
      summary: Get the complete L402-protected dataset
      description: Without valid payment proof, creates a 21-satoshi Lightning invoice and returns an L402 challenge.
      security:
        - L402: []
      responses:
        "200":
          description: Complete stratigraphy dataset after payment
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StratigraphyEntry"
        "402":
          description: Lightning payment required
          headers:
            WWW-Authenticate:
              description: L402 challenge containing the payment hash and BOLT11 invoice
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/L402Challenge"
        "429":
          description: Payment invoice creation is temporarily limited
          headers:
            Retry-After:
              description: Seconds until the client may request another payment invoice
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentChallengeRateLimitError"
        "500":
          description: Lightning payment is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentConfigurationError"
        "502":
          description: The wallet could not create or verify a payment invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletGatewayError"
        "503":
          description: Payment challenge coordination is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentChallengeServiceUnavailableError"
components:
  securitySchemes:
    L402:
      type: apiKey
      in: header
      name: Authorization
      description: "L402 <payment_hash>:<preimage>"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    StratigraphyEntry:
      type: object
      properties:
        day:
          type: integer
        title:
          type: string
        video_id:
          type: string
        transcript_summary:
          type: string
      required:
        - day
        - title
        - video_id
        - transcript_summary
    L402Challenge:
      type: object
      properties:
        invoice:
          type: string
          description: BOLT11 invoice
        payment_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
      required:
        - invoice
        - payment_hash
    PaymentChallengeRateLimitError:
      type: object
      properties:
        error:
          type: string
          const: Too many payment invoices requested
        code:
          type: string
          const: payment_challenge_rate_limited
        retry_after:
          type: integer
          minimum: 1
          description: Seconds until the client may request another payment invoice
      required:
        - error
        - code
        - retry_after
    PaymentConfigurationError:
      type: object
      properties:
        error:
          type: string
          const: NWC_URI is not configured
      required:
        - error
    PaymentChallengeServiceUnavailableError:
      type: object
      properties:
        error:
          type: string
          const: Payment challenge service unavailable
      required:
        - error
    WalletGatewayError:
      type: object
      properties:
        error:
          type: string
          enum:
            - Unable to create payment invoice
            - Unable to verify payment
      required:
        - error

