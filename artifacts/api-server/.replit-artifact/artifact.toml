kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 5000
name = "API Server"
paths = ["/.well-known/llms.txt", "/docs", "/cookbooks", "/.well-known/mcp.json", "/api", "/mcp", "/openapi.json", "/.well-known/mcp/server-card.json", "/.well-known/mcp/connector.json", "/.well-known/glama-mcp-connector.json", "/.well-known/glama.json", "/.well-known/llm-schema.json", "/smithery-verification", "/.well-known/smithery-verification"]

[services.development]
run = "PORT=5000 pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# we don't run through pnpm to make startup faster in production
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "5000"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
[[services]]
localPort = 8000
name = "Enterprise Agent API"
paths = ["/agent-api"]

[services.development]
run = "cd ../.. && PORT=8000 uv run --no-sync python main.py"

[services.production]

[services.production.build]
args = ["uv", "sync", "--frozen", "--compile-bytecode"]

[services.production.run]
args = ["uv", "run", "--no-sync", "python", "main.py"]

[services.production.run.env]
PORT = "8000"

[services.production.health.startup]
path = "/agent-api/health"
