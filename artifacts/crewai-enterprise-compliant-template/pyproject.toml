[project]
name = "enterprise-compliant-swarm-template"
version = "0.1.0"
description = "Human-supervised LangChain starter with L402 interception and a local recorder viewer."
requires-python = ">=3.11,<3.14"
license = "AGPL-3.0-only"
dependencies = [
    "l402-interceptor==0.1.0",
    "langchain==1.4.9",
    "langchain-openai==1.6.7",
]

[tool.uv]
package = false

[tool.uv.sources]
l402-interceptor = { path = "packages/l402-interceptor" }

# This exported template is its own Python dependency boundary.
[tool.uv.workspace]
members = []
