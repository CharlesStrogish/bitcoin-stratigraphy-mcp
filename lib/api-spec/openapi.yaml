openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: stratigraphy
    description: Bitcoin stratigraphy dataset
security:
  - L402: []
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/health:
    get:
      operationId: datasetHealthCheck
      tags: [health]
      summary: Public dataset health check
      description: Reports dataset availability and the paid-access protocol without requiring payment
      security: []
      responses:
        "200":
          description: Dataset API is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetHealthStatus"
  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Payment readiness check
      description: Reports whether the dependencies required to sell the paid dataset are available
      security: []
      responses:
        "200":
          description: Ready to accept paid dataset requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: One or more payment dependencies are unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
  /v1/stratigraphy/sample:
    get:
      operationId: getStratigraphy
      tags: [stratigraphy]
      summary: Get the free five-record sample
      security: []
      responses:
        "200":
          description: Latest five stratigraphy records
          content:
            application/json:
              schema:
                type: array
                minItems: 5
                maxItems: 5
                items:
                  $ref: "#/components/schemas/StratigraphyEntry"
  /v1/cost:
    get:
      operationId: getStratigraphyCost
      tags: [stratigraphy]
      summary: Inspect dataset access costs and schemas
      description: Returns public pre-flight metadata without creating an invoice or requiring L402 authorization.
      security: []
      responses:
        "200":
          description: Dataset access, MCP parameter, and response schema metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StratigraphyCost"
  /v1/stratigraphy:
    head:
      operationId: headPaidStratigraphy
      tags: [stratigraphy]
      summary: Inspect selected dataset size and cost
      description: Returns public dataset range and cost headers without creating an invoice or requiring L402 authorization.
      security: []
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 422
        - name: from
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Selected dataset metadata
          headers:
            X-Stratigraphy-Records:
              schema:
                type: integer
            X-Stratigraphy-First-Day:
              schema:
                type: integer
            X-Stratigraphy-Last-Day:
              schema:
                type: integer
            X-L402-Cost-Sats:
              schema:
                type: integer
            X-L402-Minimum-Cost-Sats:
              schema:
                type: integer
            X-L402-Subscription-Tiers:
              schema:
                type: string
        "400":
          description: Invalid or conflicting range parameters
    get:
      operationId: getPaidStratigraphy
      tags: [stratigraphy]
      summary: Get the complete L402-protected dataset
      description: Returns the selected range after payment. Legacy single-query pricing remains 1 satoshi per requested day with a 5-satoshi minimum. Reusable passes provide unlimited queries for 24 hours (5 sats) or 30 days (100 sats).
      parameters:
        - name: days
          in: query
          description: Number of most recent days to return. Cannot be combined with from.
          schema:
            type: integer
            minimum: 1
            maximum: 422
        - name: from
          in: query
          description: First date to include, using the daily series anchored at day 422 on 2026-09-09. Cannot be combined with days.
          schema:
            type: string
            format: date
      security:
        - L402: []
      responses:
        "200":
          description: Complete stratigraphy dataset after payment
          headers:
            X-L402-Receipt:
              description: JSON receipt containing the exact response-body hash, verified payment hash, delivery timestamp, and HMAC-SHA256 signature
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StratigraphyEntry"
        "402":
          description: Lightning payment required
          headers:
            WWW-Authenticate:
              description: L402 challenges for the legacy single query plus tiered 1-day and 30-day subscription passes
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/L402Challenge"
        "400":
          description: Invalid or conflicting range parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRangeError"
        "429":
          description: Payment invoice creation is temporarily limited
          headers:
            Retry-After:
              description: Seconds until the client may request another payment invoice
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentChallengeRateLimitError"
        "500":
          description: Lightning payment is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentConfigurationError"
        "502":
          description: The wallet could not create or verify a payment invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletGatewayError"
        "503":
          description: Payment challenge coordination is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentChallengeServiceUnavailableError"
components:
  securitySchemes:
    L402:
      type: apiKey
      in: header
      name: Authorization
      description: "Legacy: L402 <payment_hash>:<preimage>. Subscription: L402 <signed_macaroon>:<preimage>."
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DatasetHealthStatus:
      type: object
      properties:
        status:
          type: string
          const: ok
        datasetLength:
          type: integer
          const: 422
        protocol:
          type: string
          const: L402
      required:
        - status
        - datasetLength
        - protocol
    ReadinessStatus:
      type: object
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
        dependencies:
          type: object
          properties:
            wallet_configuration:
              type: string
              enum:
                - available
                - unavailable
            challenge_coordination:
              type: string
              enum:
                - available
                - unavailable
          required:
            - wallet_configuration
            - challenge_coordination
      required:
        - status
        - dependencies
    StratigraphyCost:
      type: object
      properties:
        protocol:
          type: string
          const: L402
        access_tiers:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: object
            properties:
              id:
                type: string
                enum: [1-day, 30-day]
              duration_days:
                type: integer
              price_sats:
                type: integer
            required: [id, duration_days, price_sats]
        legacy_query_pricing:
          type: object
          properties:
            sats_per_day:
              type: integer
              const: 1
            minimum_sats:
              type: integer
              const: 5
          required: [sats_per_day, minimum_sats]
        dataset:
          type: object
          properties:
            days:
              type: integer
              minimum: 422
            first_day:
              type: integer
              const: 1
            last_day:
              type: integer
              minimum: 422
            grows_over_time:
              type: boolean
              const: true
          required: [days, first_day, last_day, grows_over_time]
        mcp_tool:
          type: object
          properties:
            name:
              type: string
              const: get_bitcoin_stratigraphy
            parameters:
              type: object
              properties:
                days:
                  $ref: "#/components/schemas/McpToolParameter"
                date:
                  $ref: "#/components/schemas/McpToolParameter"
              required: [days, date]
          required: [name, parameters]
        response_schema:
          $ref: "#/components/schemas/JsonSchema"
      required:
        - protocol
        - access_tiers
        - legacy_query_pricing
        - dataset
        - mcp_tool
        - response_schema
    McpToolParameter:
      type: object
      properties:
        type:
          type: string
        minimum:
          type: integer
        maximum:
          type: integer
        format:
          type: string
        required:
          type: boolean
      required: [type, required]
    JsonSchema:
      type: object
      properties:
        type:
          type: string
        items:
          type: object
          additionalProperties: true
        properties:
          type: object
          additionalProperties: true
        required:
          type: array
          items:
            type: string
      required: [type]
    StratigraphyEntry:
      type: object
      properties:
        day:
          type: integer
        title:
          type: string
        video_id:
          type: string
        transcript_summary:
          type: string
        quantitative_alpha:
          $ref: "#/components/schemas/QuantitativeAlpha"
      required:
        - day
        - title
        - video_id
        - transcript_summary
        - quantitative_alpha
    QuantitativeAlpha:
      type: object
      properties:
        target_multiplier:
          type: number
          format: float
          description: Numeric distance multiplier parsed from the day's title
        difficulty_epoch_progress:
          type: string
          pattern: "^(100(?:\\.0{1,2})?|\\d{1,2}(?:\\.\\d{1,2})?)%$"
          description: Estimated progress through the current 14-day difficulty epoch
        thermodynamic_signal:
          type: string
          description: Qualitative target-distance band derived from the multiplier
      required:
        - target_multiplier
        - difficulty_epoch_progress
        - thermodynamic_signal
    L402Challenge:
      type: object
      properties:
        invoice:
          type: string
          description: BOLT11 invoice
        payment_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        passes:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/L402SubscriptionPass"
      required:
        - invoice
        - payment_hash
        - passes
    L402SubscriptionPass:
      type: object
      properties:
        tier:
          type: string
          enum: [1-day, 30-day]
        invoice:
          type: string
          description: BOLT11 invoice for this subscription tier
        payment_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        macaroon:
          type: string
          description: Signed first-party macaroon containing payment_hash, tier, and valid_until caveats
        valid_until:
          type: integer
          description: Unix timestamp in seconds after which this pass is invalid
      required:
        - tier
        - invoice
        - payment_hash
        - macaroon
        - valid_until
    InvalidRangeError:
      type: object
      properties:
        error:
          type: string
          const: Invalid stratigraphy range
        detail:
          type: string
      required:
        - error
        - detail
    PaymentChallengeRateLimitError:
      type: object
      properties:
        error:
          type: string
          const: Too many payment invoices requested
        code:
          type: string
          const: payment_challenge_rate_limited
        retry_after:
          type: integer
          minimum: 1
          description: Seconds until the client may request another payment invoice
      required:
        - error
        - code
        - retry_after
    PaymentConfigurationError:
      type: object
      properties:
        error:
          type: string
          const: NWC_URI is not configured
      required:
        - error
    PaymentChallengeServiceUnavailableError:
      type: object
      properties:
        error:
          type: string
          const: Payment challenge service unavailable
      required:
        - error
    WalletGatewayError:
      type: object
      properties:
        error:
          type: string
          enum:
            - Unable to create payment invoice
            - Unable to verify payment
      required:
        - error

