          required: [spdx, commercial_exemption, contact]
          properties:
            spdx:
              type: string
            public_license:
              type: string
            commercial_exemption:
              type: string
            contact:
              type: string
              format: email
            due_diligence_brief:
              type: string
              format: uri
        mcp:
          type: object
          required: [version, transports, capabilities]
          properties:
            version:
              type: string
              description: Newest supported MCP protocol version
            supported_versions:
              type: array
              description: Every MCP protocol version this endpoint accepts, newest first
              items:
                type: string
            transports:
              type: array
              items:
                type: object
                required: [type, endpoint]
                properties:
                  type:
                    type: string
                    enum: [streamable-http]
                  endpoint:
                    type: string
                    format: uri
            capabilities:
              type: object
              required: [tools, prompts, resources]
              properties:
                tools:
                  type: object
                  required: [count, namespaces]
                  properties:
                    count:
                      type: integer
                    namespaces:
                      type: array
                      items:
                        type: string
                prompts:
                  type: boolean
                resources:
                  type: boolean
        pricing:
          type: object
          required: [model, cost_discovery_endpoint]
          properties:
            model:
              type: string
            cost_discovery_endpoint:
              type: string
            cost_discovery_methods:
              type: array
              items:
                type: string
                enum: [GET, POST]
            batch_quotes_create_invoices:
              type: boolean
              const: false
            requirement:
              type: string
              description: L402 settlement requirement for paid tool execution
            ai_treasury_yield:
              type: object
              required: [allocation_percent, merchant_percent, structure, basis, payout_mode, eligibility]
              properties:
                allocation_percent:
                  type: integer
                  const: 21
                merchant_percent:
                  type: integer
                  const: 79
                structure:
                  type: string
                basis:
                  type: string
                payout_mode:
                  type: string
                  const: ledger_only_no_automatic_disbursement
                eligibility:
                  type: string
        verification:
          type: object
          required: [zk_proving_system, curve, time_anchor, mesh_consensus]
          properties:
            zk_proving_system:
              type: string
            curve:
              type: string
            time_anchor:
              type: string
            mesh_consensus:
              type: string
    HuggingFaceExportRecord:
      type: object
      additionalProperties: false
      required: [height, timestamp, target_multiplier, record_hash, zk_proof_status, instruction, prompt, response, day, title, video_id, transcript_summary, difficulty_epoch_progress, thermodynamic_signal]
      properties:
        height: { type: integer, description: Deterministic daily 144-block index label; not a measured block height }
        timestamp: { type: string, format: date-time, description: UTC midnight for the indexed source date }
        target_multiplier: { type: number, description: Source title-derived target-distance proxy; not measured energy }
        record_hash: { type: string, pattern: "^[0-9a-f]{64}$", description: SHA-256 of the validated source fields }
        zk_proof_status: { type: string, enum: [unavailable], description: No per-record ZK proof is present in the source dataset }
        instruction: { type: string, description: Instruction-tuning question about Bitcoin Stratigraphy terms and this entry }
        prompt: { type: string, description: Formatted instruction prompt with a response marker for text-generation training }
        response: { type: string, description: Source-grounded answer that distinguishes proxies from physical measurements }
        day: { type: integer, description: One-based source record day }
        title: { type: string, description: Validated source title }
        video_id: { type: string, description: Source video identifier }
        transcript_summary: { type: string, description: Validated source transcript summary }
        difficulty_epoch_progress: { type: string, description: Source or derived estimated 14-day epoch progress }
        thermodynamic_signal: { type: string, description: Source or derived qualitative target-distance band }
    LlmSchemaManifest:
      type: object
      description: Machine-readable export parameters, record schema, domain constraints, and verification protocols.
      required: [schema_version, dataset, endpoints, parameters, record_schema, domain_constraints, verification_protocols, access_policy]
      properties:
        schema_version: { type: string }
        dataset: { type: string }
        endpoints: { type: object, additionalProperties: true }
        parameters: { type: object, additionalProperties: true }
        record_schema: { type: object, additionalProperties: true }
        domain_constraints: { type: object, additionalProperties: true }
        verification_protocols: { type: object, additionalProperties: true }
        access_policy: { type: object, additionalProperties: true }
    ZkDriftRequest:
      type: object
      additionalProperties: false
      properties:
        sessionContextHash:
          type: string
          pattern: "^[0-9a-fA-F]{64}$"
          description: Exactly 32 bytes of digest, hex encoded; not raw session text.
        blockHeight:
          oneOf:
            - { type: integer, minimum: 0 }
            - { type: string, pattern: "^(0|[1-9][0-9]*)$" }
          description: Optional Bitcoin height; omitted means the latest block returned by the public block API.
        entropyThreshold:
          type: number
          minimum: 0
          maximum: 1
          default: 0.85
          description: Maximum permitted driftScore; 0.85 when omitted.
      required: [sessionContextHash]
    ZkDriftProof:
      type: object
      additionalProperties: false
      properties:
        circuit: { type: string, const: "zk.drift.v1" }
        pi_a:
          type: array
          minItems: 3
          maxItems: 3
          items: { type: string }
        pi_b:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: string }
        pi_c:
          type: array
          minItems: 3
          maxItems: 3
          items: { type: string }
        publicSignals:
          type: array
          minItems: 1
          items: { type: string }
          description: Ordered public commitments and circuit outputs required for independent Groth16 verification.
        verificationKeyId:
          type: string
          description: Digest identifying the drift-specific Groth16 verification key.
      required: [circuit, pi_a, pi_b, pi_c, publicSignals, verificationKeyId]
    ZkDriftResponse:
      type: object
      additionalProperties: false
      properties:
        driftScore:
          type: number
          minimum: 0
          maximum: 1
          description: (Hamming-weight gap + leading-zero difficulty gap) divided by 512; lower means closer.
        isAligned:
          type: boolean
          description: True exactly when driftScore is no greater than entropyThreshold.
        targetBlockHeight: { type: integer, minimum: 0 }
        proof:
          $ref: "#/components/schemas/ZkDriftProof"
        thermodynamicEntropyBits:
          type: integer
          minimum: 0
          maximum: 256
          description: Bit-balance proxy 2 × min(one bits, zero bits) of the context digest, not physical thermodynamic entropy.
        blockHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Bitcoin block hash returned by the public block API and bound into the proof.
        compactTarget:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: Compact nBits field returned for the targeted block, used to derive difficulty leading-zero bits.
        entropyInterpretation:
          type: string
          description: States that thermodynamicEntropyBits is a digest bit-balance proxy rather than physical entropy.
        proofInterpretation:
          type: string
          description: States the public block-provider and single-party setup trust limits of the circuit proof.
      required: [driftScore, isAligned, targetBlockHeight, proof, thermodynamicEntropyBits, blockHash, compactTarget, entropyInterpretation, proofInterpretation]
    ZkPublicInputs:
      type: object
      additionalProperties: false
      properties:
        blockHeight:
          type: integer
          minimum: 0
          maximum: 4294967295
        thermodynamicHash:
          type: string
          pattern: "^[0-9]+$"
          maxLength: 77
        snapshotDigest:
          type: string
          pattern: "^[0-9]+$"
          maxLength: 77
          description: Decimal BN254 field element digest for the bound telemetry snapshot (0 through the BN254 field modulus)
        timestamp:
          type: integer
          minimum: 0
          maximum: 281474976710655
        valuationSat:
          type: integer
          minimum: 0
          maximum: 281474976710655
      required: [blockHeight, thermodynamicHash, snapshotDigest, timestamp, valuationSat]
    ZkProof:
      type: object
      additionalProperties: false
      properties:
        proof:
          type: string
          description: Serialized zero-knowledge proof
        publicInputs:
          $ref: "#/components/schemas/ZkPublicInputs"
        verificationKeyId:
          type: string
      required: [proof, publicInputs, verificationKeyId]
    ZkTelemetryEventEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          type: object
          additionalProperties: true
          description: Telemetry payload
        zkProof:
          $ref: "#/components/schemas/ZkProof"
        meshConsensus:
          $ref: "#/components/schemas/MeshConsensus"
      required: [data, zkProof, meshConsensus]
    PaidStratigraphyResponse:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/StratigraphyEntry"
        zkProof:
          $ref: "#/components/schemas/ZkProof"
        meshConsensus:
          $ref: "#/components/schemas/MeshConsensus"
      required: [data, zkProof, meshConsensus]
    ZkVerifyRequest:
      type: object
      additionalProperties: false
      properties:
        proof:
          type: string
        publicInputs:
          $ref: "#/components/schemas/ZkPublicInputs"
        verificationKeyId:
          type: string
          description: Verification-key identifier used by the verifier
        data:
          description: Telemetry data to bind to the proof. Supplying this required payload enables binding verification; proof and publicInputs provide the cryptographic verification inputs.
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
      required: [proof, publicInputs, verificationKeyId, data]
    ZkVerifyInput:
      description: Accepted request bodies for proof verification, including direct and wrapped epistemic-anchor receipts.
      oneOf:
        - $ref: "#/components/schemas/ZkVerifyRequest"
        - $ref: "#/components/schemas/EpistemicAnchorReceipt"
        - type: object
          additionalProperties: false
          properties:
            attestation:
              $ref: "#/components/schemas/EpistemicAnchorReceipt"
            data:
              not: {}
          required: [attestation]
    ZkVerifyResponse:
      type: object
      additionalProperties: false
      properties:
        valid:
          type: boolean
        verifiedAt:
          type: string
          format: date-time
        computationTimeMs:
          type: number
          minimum: 0
      required: [valid, verifiedAt, computationTimeMs]
    EpistemicGroundingRequest:
      type: object
      additionalProperties: false
      properties:
        contextHash:
          type: string
          pattern: "^[0-9a-fA-F]{64}$"
          description: SHA-256 digest of the agent context
        agentId:
          type: string
          minLength: 1
          maxLength: 256
          description: Stable caller-controlled agent identifier
        metadata:
          type: object
          additionalProperties: true
          description: Optional non-secret JSON metadata included in the signed anchor
      required: [contextHash, agentId]
    EpistemicAnchorReceipt:
      type: object
      description: Canonical SHA-256/Merkle attestation signed as a Nostr NIP-78 event and bound to the current Bitcoin tip
      additionalProperties: true
      properties:
        schema:
          type: string
        payload:
          type: object
          additionalProperties: true
        proof:
          type: object
          additionalProperties: true
        signature:
          $ref: "#/components/schemas/NostrAttestation"
        receiptSchema:
          type: string
          const: bitcoin-stratigraphy/epistemic-anchor/v1
        contextHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        agentId:
          type: string
        blockHeight:
          type: integer
          minimum: 1
        blockHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        merkleRoot:
          type: string
          pattern: "^[0-9a-f]{64}$"
        timestamp:
          type: integer
          minimum: 0
        nostrSignature:
          $ref: "#/components/schemas/NostrAttestation"
        data:
          description: Arbitrary extension data is already permitted on this receipt.
      required:
        - schema
        - payload
        - proof
        - signature
        - receiptSchema
        - contextHash
        - agentId
        - blockHeight
        - blockHash
        - merkleRoot
        - timestamp
        - nostrSignature
    MeshPeerAttestation:
      type: object
      additionalProperties: false
      properties:
        pubkey:
          type: string
          pattern: "^[0-9a-f]{64}$"
        signature:
          type: string
          pattern: "^[0-9a-f]{128}$"
        eventId:
          type: string
          pattern: "^[0-9a-f]{64}$"
        createdAt:
          type: integer
          minimum: 0
        roundTripLatencyMs:
          type: number
          minimum: 0
      required: [pubkey, signature, eventId, createdAt, roundTripLatencyMs]
    MeshConsensus:
      type: object
      additionalProperties: false
      description: Multi-node certificate over the exact emitted data snapshot. In isolation mode the certificate contains only the local node attestation.
      properties:
        quorumScore:
          type: number
          minimum: 0
          maximum: 1
        peerAttestations:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/MeshPeerAttestation"
        merkleRoot:
          type: string
          pattern: "^[0-9a-f]{64}$"
        snapshotDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        threshold:
          type: integer
          minimum: 1
        isolationMode:
          type: boolean
        networkId:
          type: string
          minLength: 1
      required: [quorumScore, peerAttestations, merkleRoot, snapshotDigest, threshold, isolationMode, networkId]
    MeshStatus:
      type: object
      description: Output of MCP tool mesh.get_status; mesh.status is a legacy tool name.
      additionalProperties: false
      properties:
        nodePubkey:
          type: string
          pattern: "^[0-9a-f]{64}$"
        activePeerCount:
          type: integer
          minimum: 1
        configuredPeerCount:
          type: integer
          minimum: 0
        topologyHealth:
          type: string
          enum: [healthy, degraded, isolated]
        crossValidationSuccessRate:
          type: number
          minimum: 0
          maximum: 1
        averagePropagationLatencyMs:
          type: number
          minimum: 0
        quorumThreshold:
          type: integer
          minimum: 1
      required: [nodePubkey, activePeerCount, configuredPeerCount, topologyHealth, crossValidationSuccessRate, averagePropagationLatencyMs, quorumThreshold]
    NostrIdentityInput:
      type: object
      additionalProperties: false
      properties:
        pubkey: { type: string, description: Lowercase hex or npub }
        event: { $ref: "#/components/schemas/NostrIdentityEvent" }
        signature: { type: string, pattern: "^[0-9a-f]{128}$", description: Optional cross-check against event.sig; not valid alone }
      anyOf:
        - required: [pubkey]
        - required: [event]
    NostrIdentityEvent:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, pattern: "^[0-9a-f]{64}$" }
        pubkey: { type: string, pattern: "^[0-9a-f]{64}$" }
        sig: { type: string, pattern: "^[0-9a-f]{128}$" }
        kind: { type: integer }
        created_at: { type: integer }
        tags:
          type: array
          items:
            type: array
            items: { type: string }
        content: { type: string }
      required: [id, pubkey, sig, kind, created_at, tags, content]
    NostrAgentIdentity:
      type: object
      additionalProperties: false
      properties:
        pubkey: { type: string, pattern: "^[0-9a-f]{64}$" }
        isValidSignature: { type: boolean, description: False for a bare key or invalid signed event }
        attestationCount: { type: integer, minimum: 0, description: Unique trusted signers across one or two hops }
        trustScore: { type: number, minimum: 0, maximum: 1, description: "0.6 per direct trusted vouch; 0.2 per second-hop vouch, capped at 1; pinned mesh keys score 1" }
        firstSeenTimestamp: { type: ["integer", "null"], description: "Earliest valid caller or NIP-01 kind 0 profile event, seconds since epoch" }
        attestationDepth: { type: ["integer", "null"], description: "0 for pinned mesh key, 1 direct, 2 via signed introduction" }
        metadata:
          type: object
          additionalProperties: false
          properties:
            name: { type: string }
            about: { type: string }
      required: [pubkey, isValidSignature, attestationCount, trustScore, firstSeenTimestamp, attestationDepth, metadata]
    MeshAttestRequest:
      type: object
      additionalProperties: false
      properties:
        snapshotDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        networkId:
          type: string
          minLength: 1
        originPubkey:
          type: string
          pattern: "^[0-9a-f]{64}$"
        agentSession:
          type: object
          additionalProperties: false
          description: >-
            Optional agent-signed kind 20079 NIP-01 event. For direct attestation,
            event.content is JSON.stringify({networkId,snapshotDigest}). With
            date, it is JSON.stringify({networkId,date}) and the peer also
            compares the supplied signed snapshot against the selected source record.
            The signer must have a pinned-node, network-bound kind 30079 trust path.
          properties:
            event: { $ref: "#/components/schemas/NostrIdentityEvent" }
            date: { type: string, format: date }
          required: [event]
        snapshot:
          description: Complete Nostr-attested snapshot. The peer recomputes its canonical digest and verifies source attestations before signing.
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              minItems: 1
              items:
                type: object
                additionalProperties: true
      required: [snapshotDigest, networkId, originPubkey, snapshot]
    MeshSignedEvent:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{64}$"
        pubkey:
          type: string
          pattern: "^[0-9a-f]{64}$"
        created_at:
          type: integer
        kind:
          type: integer
          const: 20078
        tags:
          type: array
          items:
            type: array
            items:
              type: string
        content:
          type: string
        sig:
          type: string
          pattern: "^[0-9a-f]{128}$"
      required: [id, pubkey, created_at, kind, tags, content, sig]
    MeshAttestResponse:
      type: object
      additionalProperties: false
      properties:
        event:
          $ref: "#/components/schemas/MeshSignedEvent"
        agentIdentity:
          $ref: "#/components/schemas/NostrAgentIdentity"
      required: [event]
    SettlementAsset:
      type: string
      enum: [btc-lightning, l-btc, taproot-assets]
    MacaroonRevocationRequest:
      type: object
      additionalProperties: false
      properties:
        macaroon:
          type: string
        signature_id:
          type: string
          pattern: "^[0-9a-fA-F]{64}$"
        reason:
          type: string
          maxLength: 500
      oneOf:
        - required: [macaroon]
        - required: [signature_id]
    MacaroonRevocationResponse:
      type: object
      properties:
        signature_id:
          type: string
          pattern: "^[0-9a-f]{64}$"
        revoked_at:
          type: string
          format: date-time
        reason:
          type: string
      required:
        - signature_id
        - revoked_at
    TokenRevocationServiceUnavailableError:
      type: object
      properties:
        error:
          type: string
          const: Token revocation service unavailable
      required:
        - error
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DatasetHealthStatus:
      type: object
      properties:
        status:
          type: string
          const: ok
        datasetLength:
          type: integer
          const: 422
        protocol:
          type: string
          const: L402
      required:
        - status
        - datasetLength
        - protocol
    ReadinessStatus:
      type: object
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
        dependencies:
          type: object
          properties:
            wallet_configuration:
              type: string
              description: Availability of either the primary Coinos or fallback Alby/NWC settlement configuration
              enum:
                - available
                - unavailable
            challenge_coordination:
              type: string
              enum:
                - available
                - unavailable
          required:
            - wallet_configuration
            - challenge_coordination
      required:
        - status
        - dependencies
    StratigraphyCost:
      type: object
      properties:
        licensing_compliance:
          $ref: "#/components/schemas/LicensingCompliance"
        batchSettlement:
          $ref: "#/components/schemas/BatchSettlementDiscovery"
        protocol:
          type: string
          const: L402
        settlement_asset:
          $ref: "#/components/schemas/SettlementAsset"
        supported_assets:
          type: array
          items:
            $ref: "#/components/schemas/SettlementAsset"
          minItems: 1
          uniqueItems: true
        available_assets:
          type: array
          items:
            $ref: "#/components/schemas/SettlementAsset"
          uniqueItems: true
        access_tiers:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: object
            properties:
              id:
                type: string
                enum: [1-day, 30-day]
              duration_days:
                type: integer
              price_sats:
                type: integer
              original_price_sats:
                type: integer
              discount_sats:
                type: integer
              discount_percent:
                type: number
              base_price_sats:
                type: integer
              max_price_sats:
                type: integer
              multiplier:
                type: number
            required:
              - id
              - duration_days
              - price_sats
              - original_price_sats
              - discount_sats
              - discount_percent
              - base_price_sats
              - max_price_sats
              - multiplier
        dynamic_pricing:
          type: object
          properties:
            difficulty_epoch_progress:
              type: number
              minimum: 0
              maximum: 100
            request_velocity_rpm:
              type: number
              minimum: 0
            calculated_at:
              type: string
              format: date-time
          required:
            - difficulty_epoch_progress
            - request_velocity_rpm
            - calculated_at
        agent:
          $ref: "#/components/schemas/AgentReputationMetadata"
        legacy_query_pricing:
          type: object
          properties:
            sats_per_day:
              type: integer
              const: 1
            minimum_sats:
              type: integer
              const: 5
          required: [sats_per_day, minimum_sats]
        dataset:
          type: object
          properties:
            days:
              type: integer
              minimum: 422
            first_day:
              type: integer
              const: 1
            last_day:
              type: integer
              minimum: 422
            grows_over_time:
              type: boolean
              const: true
          required: [days, first_day, last_day, grows_over_time]
        mcp_tool:
          type: object
          properties:
            name:
              type: string
              const: stratigraphy.get
            parameters:
              type: object
              properties:
                days:
                  $ref: "#/components/schemas/McpToolParameter"
                date:
                  $ref: "#/components/schemas/McpToolParameter"
                blockHeight:
                  $ref: "#/components/schemas/McpToolParameter"
                metrics:
                  $ref: "#/components/schemas/McpToolParameter"
                startDate:
                  $ref: "#/components/schemas/McpToolParameter"
                endDate:
                  $ref: "#/components/schemas/McpToolParameter"
                startBlock:
                  $ref: "#/components/schemas/McpToolParameter"
                endBlock:
                  $ref: "#/components/schemas/McpToolParameter"
                limit:
                  $ref: "#/components/schemas/McpToolParameter"
              required: [days, date, blockHeight, metrics, startDate, endDate, startBlock, endBlock, limit]
          required: [name, parameters]
        catalog_tool:
          $ref: "#/components/schemas/StratigraphyCatalogMcpTool"
        proof_by_hash_tool:
          $ref: "#/components/schemas/ProofByHashMcpTool"
        proof_attestations_tool:
          $ref: "#/components/schemas/ListProofAttestationsMcpTool"
        submit_proof_tool:
          $ref: "#/components/schemas/SubmitZkProofMcpTool"
        response_schema:
          $ref: "#/components/schemas/JsonSchema"
      required:
        - protocol
        - settlement_asset
        - supported_assets
        - available_assets
        - access_tiers
        - dynamic_pricing
        - legacy_query_pricing
        - dataset
        - mcp_tool
        - catalog_tool
        - proof_by_hash_tool
        - proof_attestations_tool
        - submit_proof_tool
        - response_schema
    ListProofAttestationsMcpTool:
      type: object
      description: MCP proof-attestation discovery tool registered as proof.list.
      properties:
        name:
          type: string
          const: proof.list
          description: Stable MCP tool name used with tools/call.
          examples: [proof.list]
        description:
          type: string
          description: Human-readable purpose of the attestation listing tool.
          examples:
            - Discover and paginate recent proof attestation lifecycle states by status without knowing a proof hash; full retained payloads require proof.get_by_hash.
        parameters:
          type: object
          description: Optional filters accepted by the attestation listing tool.
          properties:
            limit:
              $ref: "#/components/schemas/McpToolParameter"
            status:
              $ref: "#/components/schemas/McpToolParameter"
          required: [limit, status]
        exampleResult:
          $ref: "#/components/schemas/ListProofAttestationsResult"
      required: [name, description, parameters, exampleResult]
    ListProofAttestationsResult:
      type: object
      description: Recent indexed proof attestations and the total matching count.
      properties:
        attestations:
          type: array
          description: Indexed proof attestations ordered from newest to oldest.
          items:
            $ref: "#/components/schemas/ProofAttestationRecord"
        total:
          type: integer
          minimum: 0
          description: Total matching records before the result limit is applied.
          examples: [1]
      required: [attestations, total]
    ProofAttestationRecord:
      type: object
      description: One indexed zk-SNARK verification and Nostr attestation record.
      properties:
        proofHash:
          type: string
          description: Lowercase 0x-prefixed SHA-256 proof fingerprint.
          examples:
            - "0x1a2b3c4d5e6f789001234567890abcdef1234567890abcdef1234567890abcd"
        snapshotDigest:
          type: string
          description: Snapshot CID or decimal Poseidon digest bound to the proof.
          examples: ["1534979302823651498736582947365829473658294"]
        status:
          type: string
          enum: [verified, cached, pending, invalid]
          description: Current lifecycle verification state.
          examples: [verified]
        submittedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the proof entered the lifecycle index.
          examples: ["2026-09-19T06:20:00.000Z"]
        attestationCount:
          type: integer
          minimum: 0
          description: Number of recorded Nostr NIP-78 attestations.
          examples: [1]
        meshQuorum:
          type: boolean
          description: Whether the attestation count meets the current mesh quorum.
          examples: [true]
      required:
        - proofHash
        - snapshotDigest
        - status
        - submittedAt
        - attestationCount
        - meshQuorum
    SubmitZkProofMcpTool:
      type: object
      description: MCP proof ingestion tool registered as proof.submit.
      properties:
        name:
          type: string
          const: proof.submit
          description: Stable MCP tool name used with tools/call.
          examples: [proof.submit]
        description:
          type: string
          description: Human-readable purpose of the proof ingestion tool.
          examples:
            - Submit a new Groth16/Poseidon zk-SNARK proof payload and public signals to the data engine for verification, lifecycle indexing, and Nostr NIP-78 attestation broadcast.
        requiredInputs:
          type: array
          description: Input property names required for every submission.
          examples:
            - [proof, publicSignals]
          items:
            type: string
            enum: [proof, publicSignals]
        optionalInputs:
          type: array
          description: Optional input property names accepted by the submission.
          examples:
            - [snapshotDigest]
          items:
            type: string
            enum: [snapshotDigest]
        exampleResult:
          $ref: "#/components/schemas/SubmitZkProofResult"
      required: [name, description, requiredInputs, optionalInputs, exampleResult]
    SubmitZkProofResult:
      type: object
      description: Immediate proof ingestion and Nostr publication result.
      properties:
        proofHash:
          type: string
          description: Lowercase 0x-prefixed SHA-256 fingerprint of the canonical proof.
          examples:
            - "0x1a2b3c4d5e6f789001234567890abcdef1234567890abcdef1234567890abcd"
        jobId:
          type: string
          format: uuid
          description: Server-generated submission job ID accepted by proof.get_by_hash.
          examples: ["123e4567-e89b-42d3-a456-426614174000"]
        status:
          type: string
          enum: [verified, invalid]
          description: Immediate Groth16 verification result.
          examples: [verified]
        submittedAt:
          type: string
          format: date-time
          description: ISO 8601 proof submission timestamp.
          examples: ["2026-09-19T06:20:00.000Z"]
        attestationStatus:
          type: string
          description: Nostr NIP-78 broadcast confirmation state.
          examples: [broadcast_confirmed]
      required: [proofHash, jobId, status, submittedAt, attestationStatus]
    ProofByHashMcpTool:
      type: object
      description: MCP proof and lifecycle lookup tool registered as proof.get_by_hash.
      properties:
        name:
          type: string
          const: proof.get_by_hash
          description: Stable MCP tool name used with tools/call.
          examples: [proof.get_by_hash]
        description:
          type: string
          description: Human-readable purpose of the proof and lifecycle lookup.
          examples:
            - Fetch a recorded ZK proof or receipt by hash fingerprint/CID. Do NOT use to generate new proofs or anchors.
        identifiers:
          type: array
          description: Alternative lookup keys; provide either hash or jobId.
          examples:
            - [hash, jobId]
          items:
            type: string
            enum: [hash, jobId]
        exampleResult:
          type: object
          description: A status-only lookup result omits proofPayload when the payload is not retained.
          properties:
            kind:
              type: string
              enum: [zk-proof, dataset-receipt, context-receipt, zk-proof-status]
              examples: [zk-proof]
            hash:
              type: string
              examples: ["0x1a2b3c4d5e6f789001234567890abcdef1234567890abcdef1234567890abcd"]
            jobId:
              type: string
              format: uuid
              description: Submission job ID when a proof payload is retained.
            status:
              type: string
              enum: [verified, cached, pending, invalid]
              examples: [pending]
            timestamp:
              type: string
              format: date-time
              examples: ["2026-09-19T05:54:39.835Z"]
            attestationCount:
              type: integer
              minimum: 0
              examples: [0]
            meshQuorum:
              type: boolean
              examples: [false]
            proofPayload:
              type: object
              description: Optional retained proof or signed receipt payload; omitted for status-only records.
              additionalProperties: true
          required: [kind, hash, status, timestamp]
      required: [name, description, identifiers, exampleResult]
    StratigraphyCatalogMcpTool:
      type: object
      description: MCP dataset discovery tool registered as stratigraphy.list.
      properties:
        name:
          type: string
          description: Stable MCP tool name used with tools/call.
          const: stratigraphy.list
          examples: [stratigraphy.list]
        description:
          type: string
          description: Human-readable purpose of the catalog discovery tool.
          examples:
            - Discover available stratigraphy datasets, date ranges, total recorded epochs, block height bounds, and available telemetry metrics without requiring prior knowledge of exact snapshot parameters.
        catalog:
          $ref: "#/components/schemas/StratigraphyCatalog"
      required: [name, description, catalog]
    StratigraphyCatalog:
      type: object
      description: Discoverable bounds and metric inventory for the stratigraphy dataset.
      properties:
        totalSnapshots:
          type: integer
          minimum: 1
          description: Total number of daily stratigraphy snapshots currently available.
          examples: [422]
        oldestBlock:
          type: integer
          minimum: 0
          description: Lowest block height in the deterministic daily snapshot index.
          examples: [859376]
        newestBlock:
          type: integer
          minimum: 0
          description: Highest block height in the deterministic daily snapshot index.
          examples: [920000]
        availableMetrics:
          type: array
          description: Dot-delimited telemetry metric paths available in each snapshot.
          examples:
            - [day, title, video_id, transcript_summary, quantitative_alpha.target_multiplier]
          items:
            type: string
            description: Dot-delimited path of an available telemetry metric.
            examples: [quantitative_alpha.target_multiplier]
        dateBounds:
          type: object
          description: Inclusive ISO date bounds of the available snapshots.
          properties:
            startDate:
              type: string
              format: date
              description: ISO 8601 date of the oldest available snapshot.
              examples: ["2025-07-15"]
            endDate:
              type: string
              format: date
              description: ISO 8601 date of the newest available snapshot.
              examples: ["2026-09-09"]
          required: [startDate, endDate]
      required: [totalSnapshots, oldestBlock, newestBlock, availableMetrics, dateBounds]
    McpToolParameter:
      type: object
      properties:
        type:
          type: string
          description: JSON Schema primitive type accepted by the tool parameter.
        minimum:
          type: integer
          description: Inclusive minimum integer value when applicable.
        maximum:
          type: integer
          description: Inclusive maximum integer value when applicable.
        format:
          type: string
          description: JSON Schema string format when applicable.
        description:
          type: string
          description: Detailed formatting and behavioral contract for the parameter.
        example:
          description: Concrete accepted parameter value.
        allowedValues:
          type: array
          description: Allowed string values for an enum or array parameter.
          items:
            type: string
        required:
          type: boolean
          description: Whether callers must provide this parameter.
      required: [type, description, example, required]
    JsonSchema:
      type: object
      properties:
        type:
          type: string
        items:
          type: object
          additionalProperties: true
        properties:
          type: object
          additionalProperties: true
        required:
          type: array
          items:
            type: string
      required: [type]
    MacaroonAttenuationRequest:
      type: object
      properties:
        macaroon:
          type: string
        caveats:
          type: array
          minItems: 1
          items:
            type: string
            pattern: "^(allowed_path=/[^\\s]*|max_requests=[1-9]\\d*)$"
      required: [macaroon, caveats]
    MacaroonAttenuationResponse:
      type: object
      properties:
        macaroon:
          type: string
        caveats:
          type: object
          properties:
            allowed_path:
              type: array
              items:
                type: string
            max_requests:
              type: integer
              minimum: 1
          required: [allowed_path]
      required: [macaroon, caveats]
    NostrHeartbeatStatus:
      type: object
      properties:
        event_id:
          type: [string, "null"]
        pubkey:
          type: [string, "null"]
        published_at:
          type: [string, "null"]
          format: date-time
        relays:
          type: array
          items:
            type: object
            properties:
              relay:
                type: string
                format: uri
              status:
                type: string
                enum: [pending, settled, failed]
              message:
                type: string
            required: [relay, status]
      required: [event_id, pubkey, published_at, relays]
    StratigraphyEntry:
      type: object
      properties:
        day:
          type: integer
        title:
          type: string
        video_id:
          type: string
        transcript_summary:
          type: string
        quantitative_alpha:
          $ref: "#/components/schemas/QuantitativeAlpha"
        prevHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: SHA-256 hash of the prior indexed stratum, or 64 zeroes for genesis; not a Bitcoin block hash.
        stratumHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Domain-separated SHA-256 hash of this source-record fingerprint, index, and prevHash.
        attestation:
          $ref: "#/components/schemas/NostrAttestation"
      required:
        - day
        - title
        - video_id
        - transcript_summary
        - quantitative_alpha
        - prevHash
        - stratumHash
    ProvenanceChainStatus:
      type: object
      additionalProperties: false
      properties:
        totalDepth: { type: integer, minimum: 1 }
        merkleRoot: { type: string, pattern: "^[0-9a-f]{64}$" }
        latestOtsStatus: { type: string, enum: [not_anchored, pending_calendar, bitcoin_block_attested] }
        genesisHash: { type: string, pattern: "^[0-9a-f]{64}$" }
        headHash: { type: string, pattern: "^[0-9a-f]{64}$" }
      required: [totalDepth, merkleRoot, latestOtsStatus, genesisHash, headHash]
    ProvenanceAnchorStatus:
      type: object
      additionalProperties: false
      properties:
        headHash: { type: string, pattern: "^[0-9a-f]{64}$" }
        merkleRoot: { type: string, pattern: "^[0-9a-f]{64}$" }
        totalDepth: { type: integer, minimum: 1 }
        otsStatus: { type: string, enum: [not_anchored, pending_calendar, bitcoin_block_attested] }
        otsProof:
          type: string
          format: byte
          description: Base64-encoded serialized .ots receipt, present after a successful calendar stamp.
        updatedAt: { type: string, format: date-time }
      required: [headHash, merkleRoot, totalDepth, otsStatus]
    NostrAttestation:
      type: object
      description: NIP-01 signed NIP-78 attestation over the payload before this block was attached
      properties:
        protocol:
          type: string
          const: nostr
        nip:
          type: integer
          const: 78
        payload_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        event:
          $ref: "#/components/schemas/NostrSignedEvent"
      required: [protocol, nip, payload_sha256, event]
    NostrSignedEvent:
      type: object
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{64}$"
        pubkey:
          type: string
          pattern: "^[0-9a-f]{64}$"
        created_at:
          type: integer
        kind:
          type: integer
          const: 30078
        tags:
          type: array
          items:
            type: array
            items:
              type: string
        content:
          type: string
        sig:
          type: string
          pattern: "^[0-9a-f]{128}$"
      required: [id, pubkey, created_at, kind, tags, content, sig]
    QuantitativeAlpha:
      type: object
      properties:
        target_multiplier:
          type: number
          format: float
          description: Numeric distance multiplier parsed from the day's title
        difficulty_epoch_progress:
          type: string
          pattern: "^(100(?:\\.0{1,2})?|\\d{1,2}(?:\\.\\d{1,2})?)%$"
          description: Estimated progress through the current 14-day difficulty epoch
        thermodynamic_signal:
          type: string
          description: Qualitative target-distance band derived from the multiplier
      required:
        - target_multiplier
        - difficulty_epoch_progress
        - thermodynamic_signal
    L402Challenge:
      type: object
      properties:
        macaroon:
          type: string
          description: Single-use capability bound to the quoted record range, route, invoice amount and issuer. Retain it for merchant NWC verification when no preimage is available.
        invoice:
          type: string
          description: Invoice or payment request for the selected settlement asset
        payment_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        settlement_asset:
          $ref: "#/components/schemas/SettlementAsset"
        supported_assets:
          type: array
          items:
            $ref: "#/components/schemas/SettlementAsset"
          minItems: 1
          uniqueItems: true
        available_assets:
          type: array
          items:
            $ref: "#/components/schemas/SettlementAsset"
          uniqueItems: true
        agent:
          $ref: "#/components/schemas/AgentReputationMetadata"
        passes:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/L402SubscriptionPass"
        agent_instruction:
          type: string
          description: Retry guidance naming both settlement paths and the free preflight checks.
        settlement_paths:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/L402SettlementPath"
        preflight:
          $ref: "#/components/schemas/L402Preflight"
      required:
        - invoice
        - payment_hash
        - settlement_asset
        - supported_assets
        - available_assets
        - passes
    L402PaymentRequired:
      type: object
      description: Fixed-fee L402 challenge body. Paying the invoice does not itself execute the request; retry the identical request with one of settlement_paths.
      properties:
        error:
          type: string
        macaroon:
          type: string
          description: Single-use path-scoped capability bound to the invoice.
        invoice:
          type: string
          description: BOLT11 Lightning invoice
        payment_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        amount_sats:
          type: integer
          minimum: 1
        max_requests:
          type: integer
          minimum: 1
        agent_id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:@/+=%~#-]{0,127}$"
          description: Present when the challenge request was NIP-98 signed (the verified signer pubkey) or declared X-Agent-Id or a body agent_id. The macaroon carries the matching "agent_id = <agent_id>" caveat, and every redemption must declare the same value, or re-sign with NIP-98 when agent_authentication is present.
        agent_authentication:
          type: string
          enum: [nip98]
          description: Present when a valid NIP-98 event signed the challenge request. The macaroon also carries "agent_authentication = nip98", so every redemption must send a fresh NIP-98 event from agent_id in X-Nostr-Authorization; a missing event returns 401 and a different signer 403.
        agent_instruction:
          type: string
          description: Retry guidance naming both settlement paths and the free preflight checks.
        settlement_paths:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/L402SettlementPath"
        preflight:
          $ref: "#/components/schemas/L402Preflight"
        staged_preview:
          type: object
          additionalProperties: true
          description: ENDPOINT_READY_AWAITING_L402_SETTLEMENT preview with the expected output schema; computation has not run.
      required:
        - macaroon
        - invoice
        - payment_hash
        - amount_sats
        - agent_instruction
        - settlement_paths
        - preflight
    EnterpriseDueDiligenceBrief:
