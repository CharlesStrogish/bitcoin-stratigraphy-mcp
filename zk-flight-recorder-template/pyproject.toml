[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "zk-flight-recorder-template"
version = "0.1.0"
description = "LangChain execution recorder with prepaid L402 heuristic scanner commitments"
requires-python = ">=3.11"
dependencies = ["langchain-core>=1.7.6,<2"]

[tool.setuptools]
py-modules = ["flight_recorder"]
