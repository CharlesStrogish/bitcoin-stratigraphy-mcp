name: Validate standalone template
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.26.1"
      - run: npm run setup
      - run: python -m pip check
      - run: npm run check
      - run: npm test
      - run: python -m unittest discover -s packages/l402-interceptor/tests -v
      - run: npm run test:dashboard
      - run: npm run typecheck
      - run: python scripts/smoke_start.py
      - run: pnpm --dir dashboard --ignore-workspace audit --audit-level low
      - run: |
          python -m pip install pip-audit
          python -m pip_audit --disable-pip --no-deps -r requirements-audit.txt
