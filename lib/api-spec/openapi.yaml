openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: stratigraphy
    description: Bitcoin stratigraphy dataset
security:
  - L402: []
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/health:
    get:
      operationId: datasetHealthCheck
      tags: [health]
      summary: Public dataset health check
      description: Reports dataset availability and the paid-access protocol without requiring payment
      security: []
      responses:
        "200":
          description: Dataset API is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetHealthStatus"
  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Payment readiness check
      description: Reports whether the dependencies required to sell the paid dataset are available
      security: []
      responses:
        "200":
          description: Ready to accept paid dataset requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: One or more payment dependencies are unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
  /v1/stratigraphy/sample:
    get:
      operationId: getStratigraphy
      tags: [stratigraphy]
      summary: Get the free five-record sample
      security: []
      responses:
        "200":
          description: Latest five stratigraphy records
          content:
            application/json:
              schema:
                type: array
                minItems: 5
                maxItems: 5
                items:
                  $ref: "#/components/schemas/StratigraphyEntry"
  /v1/cost:
    get:
      operationId: getStratigraphyCost
      tags: [stratigraphy]
      summary: Inspect dataset access costs and schemas
      description: >-
        Returns public pre-flight metadata without creating an invoice or
        requiring L402 authorization. Clients may send a NIP-98 event as
        `Authorization: Nostr <base64_event>` to receive pubkey-tier-adjusted
        prices.
      security:
        - {}
        - NIP98: []
      responses:
        "200":
          description: Dataset access, MCP parameter, and response schema metadata
          headers:
            X-L402-Subscription-Tiers:
              description: Current dynamic tier prices in satoshis
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StratigraphyCost"
        "401":
          description: Invalid NIP-98 authorization
  /v1/nostr/status:
    get:
      operationId: getNostrHeartbeatStatus
      tags: [health]
      summary: Get the latest Nostr heartbeat status
      security: []
      responses:
        "200":
          description: Latest signed event and relay acknowledgement status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NostrHeartbeatStatus"
  /v1/macaroon/attenuate:
    post:
      operationId: attenuateMacaroon
      tags: [stratigraphy]
      summary: Create a more restrictive child subscription macaroon
      description: Requires a valid paid parent macaroon and preimage in the L402 Authorization header. Appends allowed_path and max_requests first-party caveats without exposing the server signing secret.
      security:
        - L402: []
      parameters:
        - name: X-Nostr-Authorization
          in: header
          description: Required NIP-98 identity for an agent-bound parent. The event payload tag must contain the SHA-256 of the exact request body.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MacaroonAttenuationRequest"
      responses:
        "200":
          description: Cryptographically attenuated child macaroon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MacaroonAttenuationResponse"
        "400":
          description: Invalid request or caveat
        "401":
          description: Invalid or unpaid parent macaroon
        "502":
          description: Wallet payment verification unavailable
        "503":
          description: Token revocation lookup unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenRevocationServiceUnavailableError"
  /v1/macaroon/revoke:
    post:
      operationId: revokeMacaroon
      tags: [stratigraphy]
      summary: Revoke a subscription macaroon immediately
      description: Adds a macaroon's final signature identifier to the shared revocation index. Requires the dedicated operator bearer secret.
      security:
        - MacaroonOperator: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MacaroonRevocationRequest"
      responses:
        "200":
          description: Token is revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MacaroonRevocationResponse"
        "400":
          description: Invalid macaroon or signature identifier
        "401":
          description: Operator authorization failed
        "503":
          description: Revocation is not configured or storage is unavailable
  /v1/stratigraphy:
    head:
      operationId: headPaidStratigraphy
      tags: [stratigraphy]
      summary: Inspect selected dataset size and cost
      description: Returns public dataset range and cost headers without creating an invoice or requiring L402 authorization.
      security: []
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 422
        - name: from
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Selected dataset metadata
          headers:
            X-Stratigraphy-Records:
              schema:
                type: integer
            X-Stratigraphy-First-Day:
              schema:
                type: integer
            X-Stratigraphy-Last-Day:
              schema:
                type: integer
            X-L402-Cost-Sats:
              schema:
                type: integer
            X-L402-Minimum-Cost-Sats:
              schema:
                type: integer
            X-L402-Subscription-Tiers:
              schema:
                type: string
        "400":
          description: Invalid or conflicting range parameters
    get:
      operationId: getPaidStratigraphy
      tags: [stratigraphy]
      summary: Get the complete L402-protected dataset
      description: Returns the selected range after payment. Legacy single-query pricing remains 1 satoshi per requested day with a 5-satoshi minimum. Reusable 24-hour passes are dynamically priced from 5 to 15 sats and 30-day passes from 100 to 250 sats; inspect /v1/cost or the issued L402 challenge for the current exact price.
      parameters:
        - name: days
          in: query
          description: Number of most recent days to return. Cannot be combined with from.
          schema:
            type: integer
            minimum: 1
            maximum: 422
        - name: from
          in: query
          description: First date to include, using the daily series anchored at day 422 on 2026-09-09. Cannot be combined with days.
          schema:
            type: string
            format: date
        - name: X-Nostr-Authorization
          in: header
          description: Required NIP-98 identity when presenting an agent-bound L402 macaroon because Authorization carries the L402 credential.
          schema:
            type: string
      security:
        - L402: []
      responses:
        "200":
          description: Complete stratigraphy dataset after payment
          headers:
            X-L402-Receipt:
              description: JSON receipt containing the exact response-body hash, verified payment hash, delivery timestamp, and HMAC-SHA256 signature
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StratigraphyEntry"
        "402":
          description: Lightning payment required
          headers:
            WWW-Authenticate:
              description: L402 challenges for the legacy single query plus tiered 1-day and 30-day subscription passes
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/L402Challenge"
        "400":
          description: Invalid or conflicting range parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRangeError"
        "401":
          description: Invalid NIP-98 authorization or agent identity mismatch
        "429":
          description: Payment invoice creation is temporarily limited
          headers:
            Retry-After:
              description: Seconds until the client may request another payment invoice
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentChallengeRateLimitError"
        "500":
          description: Lightning payment is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentConfigurationError"
        "502":
          description: The wallet could not create or verify a payment invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletGatewayError"
        "503":
          description: Payment challenge coordination or token revocation lookup is unavailable
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PaymentChallengeServiceUnavailableError"
                  - $ref: "#/components/schemas/TokenRevocationServiceUnavailableError"
  /v1/stratigraphy/stream:
    get:
      operationId: streamStratigraphyTelemetry
      tags: [stratigraphy]
      summary: Stream live Bitcoin stratigraphy telemetry
      description: Opens a persistent Server-Sent Events stream after validating a paid subscription macaroon and its Lightning payment preimage. Telemetry events contain block, difficulty, sats/USD, and thermodynamic signals. Ping events are emitted every 15 seconds.
      parameters:
        - name: X-Nostr-Authorization
          in: header
          description: Required NIP-98 identity when presenting an agent-bound L402 macaroon.
          schema:
            type: string
      security:
        - L402: []
      responses:
        "200":
          description: Authenticated telemetry event stream
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-cache
            Connection:
              schema:
                type: string
                const: keep-alive
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE messages with telemetry and ping event types and JSON data payloads.
        "402":
          description: Lightning payment required
          headers:
            WWW-Authenticate:
              description: L402 challenges including tiered subscription passes
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/L402Challenge"
        "401":
          description: Invalid NIP-98 authorization or agent identity mismatch
        "403":
          description: The macaroon path caveat does not permit this stream
        "429":
          description: Payment invoice creation or macaroon usage is limited
        "500":
          description: Lightning payment or server signing is not configured
        "502":
          description: Wallet payment verification is unavailable
        "503":
          description: Payment challenge coordination or token revocation lookup is unavailable
components:
  securitySchemes:
    L402:
      type: apiKey
      in: header
      name: Authorization
      description: "Legacy: L402 <payment_hash>:<preimage>. Subscription: L402 <signed_macaroon>:<preimage>."
    NIP98:
      type: apiKey
      in: header
      name: Authorization
      description: "Optional agent identity during discovery or challenge issuance: Nostr <base64_event>. When Authorization carries L402, provide the NIP-98 value in X-Nostr-Authorization."
    MacaroonOperator:
      type: http
      scheme: bearer
      description: Dedicated operator secret supplied through MACAROON_OPERATOR_SECRET.
  schemas:
    MacaroonRevocationRequest:
      type: object
      additionalProperties: false
      properties:
        macaroon:
          type: string
        signature_id:
          type: string
          pattern: "^[0-9a-fA-F]{64}$"
        reason:
          type: string
          maxLength: 500
      oneOf:
        - required: [macaroon]
        - required: [signature_id]
    MacaroonRevocationResponse:
      type: object
      properties:
        signature_id:
          type: string
          pattern: "^[0-9a-f]{64}$"
        revoked_at:
          type: string
          format: date-time
        reason:
          type: string
      required:
        - signature_id
        - revoked_at
    TokenRevocationServiceUnavailableError:
      type: object
      properties:
        error:
          type: string
          const: Token revocation service unavailable
      required:
        - error
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DatasetHealthStatus:
      type: object
      properties:
        status:
          type: string
          const: ok
        datasetLength:
          type: integer
          const: 422
        protocol:
          type: string
          const: L402
      required:
        - status
        - datasetLength
        - protocol
    ReadinessStatus:
      type: object
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
        dependencies:
          type: object
          properties:
            wallet_configuration:
              type: string
              description: Availability of either the primary Coinos or fallback Alby/NWC settlement configuration
              enum:
                - available
                - unavailable
            challenge_coordination:
              type: string
              enum:
                - available
                - unavailable
          required:
            - wallet_configuration
            - challenge_coordination
      required:
        - status
        - dependencies
    StratigraphyCost:
      type: object
      properties:
        protocol:
          type: string
          const: L402
        access_tiers:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: object
            properties:
              id:
                type: string
                enum: [1-day, 30-day]
              duration_days:
                type: integer
              price_sats:
                type: integer
              original_price_sats:
                type: integer
              discount_sats:
                type: integer
              discount_percent:
                type: number
              base_price_sats:
                type: integer
              max_price_sats:
                type: integer
              multiplier:
                type: number
            required:
              - id
              - duration_days
              - price_sats
              - original_price_sats
              - discount_sats
              - discount_percent
              - base_price_sats
              - max_price_sats
              - multiplier
        dynamic_pricing:
          type: object
          properties:
            difficulty_epoch_progress:
              type: number
              minimum: 0
              maximum: 100
            request_velocity_rpm:
              type: number
              minimum: 0
            calculated_at:
              type: string
              format: date-time
          required:
            - difficulty_epoch_progress
            - request_velocity_rpm
            - calculated_at
        agent:
          $ref: "#/components/schemas/AgentReputationMetadata"
        legacy_query_pricing:
          type: object
          properties:
            sats_per_day:
              type: integer
              const: 1
            minimum_sats:
              type: integer
              const: 5
          required: [sats_per_day, minimum_sats]
        dataset:
          type: object
          properties:
            days:
              type: integer
              minimum: 422
            first_day:
              type: integer
              const: 1
            last_day:
              type: integer
              minimum: 422
            grows_over_time:
              type: boolean
              const: true
          required: [days, first_day, last_day, grows_over_time]
        mcp_tool:
          type: object
          properties:
            name:
              type: string
              const: get_bitcoin_stratigraphy
            parameters:
              type: object
              properties:
                days:
                  $ref: "#/components/schemas/McpToolParameter"
                date:
                  $ref: "#/components/schemas/McpToolParameter"
              required: [days, date]
          required: [name, parameters]
        response_schema:
          $ref: "#/components/schemas/JsonSchema"
      required:
        - protocol
        - access_tiers
        - dynamic_pricing
        - legacy_query_pricing
        - dataset
        - mcp_tool
        - response_schema
    McpToolParameter:
      type: object
      properties:
        type:
          type: string
        minimum:
          type: integer
        maximum:
          type: integer
        format:
          type: string
        required:
          type: boolean
      required: [type, required]
    JsonSchema:
      type: object
      properties:
        type:
          type: string
        items:
          type: object
          additionalProperties: true
        properties:
          type: object
          additionalProperties: true
        required:
          type: array
          items:
            type: string
      required: [type]
    MacaroonAttenuationRequest:
      type: object
      properties:
        macaroon:
          type: string
        caveats:
          type: array
          minItems: 1
          items:
            type: string
            pattern: "^(allowed_path=/[^\\s]*|max_requests=[1-9]\\d*)$"
      required: [macaroon, caveats]
    MacaroonAttenuationResponse:
      type: object
      properties:
        macaroon:
          type: string
        caveats:
          type: object
          properties:
            allowed_path:
              type: array
              items:
                type: string
            max_requests:
              type: integer
              minimum: 1
          required: [allowed_path]
      required: [macaroon, caveats]
    NostrHeartbeatStatus:
      type: object
      properties:
        event_id:
          type: [string, "null"]
        pubkey:
          type: [string, "null"]
        published_at:
          type: [string, "null"]
          format: date-time
        relays:
          type: array
          items:
            type: object
            properties:
              relay:
                type: string
                format: uri
              status:
                type: string
                enum: [pending, settled, failed]
              message:
                type: string
            required: [relay, status]
      required: [event_id, pubkey, published_at, relays]
    StratigraphyEntry:
      type: object
      properties:
        day:
          type: integer
        title:
          type: string
        video_id:
          type: string
        transcript_summary:
          type: string
        quantitative_alpha:
          $ref: "#/components/schemas/QuantitativeAlpha"
        attestation:
          $ref: "#/components/schemas/NostrAttestation"
      required:
        - day
        - title
        - video_id
        - transcript_summary
        - quantitative_alpha
    NostrAttestation:
      type: object
      description: NIP-01 signed NIP-78 attestation over the payload before this block was attached
      properties:
        protocol:
          type: string
          const: nostr
        nip:
          type: integer
          const: 78
        payload_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        event:
          $ref: "#/components/schemas/NostrSignedEvent"
      required: [protocol, nip, payload_sha256, event]
    NostrSignedEvent:
      type: object
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{64}$"
        pubkey:
          type: string
          pattern: "^[0-9a-f]{64}$"
        created_at:
          type: integer
        kind:
          type: integer
          const: 30078
        tags:
          type: array
          items:
            type: array
            items:
              type: string
        content:
          type: string
        sig:
          type: string
          pattern: "^[0-9a-f]{128}$"
      required: [id, pubkey, created_at, kind, tags, content, sig]
    QuantitativeAlpha:
      type: object
      properties:
        target_multiplier:
          type: number
          format: float
          description: Numeric distance multiplier parsed from the day's title
        difficulty_epoch_progress:
          type: string
          pattern: "^(100(?:\\.0{1,2})?|\\d{1,2}(?:\\.\\d{1,2})?)%$"
          description: Estimated progress through the current 14-day difficulty epoch
        thermodynamic_signal:
          type: string
          description: Qualitative target-distance band derived from the multiplier
      required:
        - target_multiplier
        - difficulty_epoch_progress
        - thermodynamic_signal
    L402Challenge:
      type: object
      properties:
        invoice:
          type: string
          description: BOLT11 invoice
        payment_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        agent:
          $ref: "#/components/schemas/AgentReputationMetadata"
        passes:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/L402SubscriptionPass"
      required:
        - invoice
        - payment_hash
        - passes
    L402SubscriptionPass:
      type: object
      properties:
        tier:
          type: string
          enum: [1-day, 30-day]
        invoice:
          type: string
          description: BOLT11 invoice for this subscription tier
        payment_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        macaroon:
          type: string
          description: Signed first-party macaroon containing payment_hash, tier, valid_until, and exact issued amount caveats
        valid_until:
          type: integer
          description: Unix timestamp in seconds after which this pass is invalid
        price_sats:
          type: integer
          description: Dynamic price bound into this pass and its invoice
        original_price_sats:
          type: integer
          description: Dynamic scarcity price before the presenting agent's tier discount
        discount_sats:
          type: integer
        discount_percent:
          type: number
        agent_tier:
          type: string
          enum: [STANDARD, VIP, SWARM]
      required:
        - tier
        - invoice
        - payment_hash
        - macaroon
        - valid_until
        - price_sats
        - original_price_sats
        - discount_sats
        - discount_percent
        - agent_tier
    AgentReputationMetadata:
      type: object
      properties:
        pubkey:
          type: string
          pattern: "^[0-9a-f]{64}$"
        tier:
          type: string
          enum: [STANDARD, VIP, SWARM]
        discount_percent:
          type: number
        rate_limit_multiplier:
          type: number
      required: [pubkey, tier, discount_percent, rate_limit_multiplier]
    InvalidRangeError:
      type: object
      properties:
        error:
          type: string
          const: Invalid stratigraphy range
        detail:
          type: string
      required:
        - error
        - detail
    PaymentChallengeRateLimitError:
      type: object
      properties:
        error:
          type: string
          const: Too many payment invoices requested
        code:
          type: string
          const: payment_challenge_rate_limited
        retry_after:
          type: integer
          minimum: 1
          description: Seconds until the client may request another payment invoice
      required:
        - error
        - code
        - retry_after
    PaymentConfigurationError:
      type: object
      properties:
        error:
          type: string
          const: NWC_URI is not configured
      required:
        - error
    PaymentChallengeServiceUnavailableError:
      type: object
      properties:
        error:
          type: string
          const: Payment challenge service unavailable
      required:
        - error
    WalletGatewayError:
      type: object
      properties:
        error:
          type: string
          enum:
            - Unable to create payment invoice
            - Unable to verify payment
      required:
        - error

