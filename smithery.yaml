# Remote MCP connection metadata for the existing externally hosted server.
# No Docker build, local start command, wallet secrets, or server changes needed.
# Smithery currently registers remote servers by URL, not by deploying this YAML:
# https://smithery.ai/docs/build/publish
# smithery mcp publish "https://bitcoin-stratigraphy-dashboard.replit.app/mcp" -n crstrogish/bitcoin-stratigraphy-mcp
name: bitcoin-stratigraphy
displayName: Bitcoin Stratigraphy Notary
description: >-
  Discover indexed Bitcoin strata for free. Paid MCP telemetry and Groth16
  proof verification use per-tool L402 challenges; check payment.get_info for
  current prices and x402 availability before attempting settlement.
tags:
  - bitcoin
  - l402
  - x402
  - lightning
  - base
  - zk-snark
  - groth16
  - thermodynamic
  - mcp
  - streamable-http
homepage: https://bitcoin-stratigraphy-dashboard.replit.app
transport:
  # MCP 2025-11-25 negotiated successfully at this public endpoint.
  type: streamable-http
  url: https://bitcoin-stratigraphy-dashboard.replit.app/mcp
connection:
  sdk: "@modelcontextprotocol/sdk"
  clientTransportImport: "@modelcontextprotocol/sdk/client/streamableHttp.js"
  clientTransportClass: StreamableHTTPClientTransport
  url: https://bitcoin-stratigraphy-dashboard.replit.app/mcp
  note: >-
    No connection-time credentials are required for discovery. A wallet-enabled
    client must handle HTTP 402 and retry with Authorization: L402
    <macaroon>:<preimage> for paid tools; this file contains no wallet secrets.
pricing:
  freeDiscovery:
    tools: [stratigraphy.list, payment.get_info]
    priceSats: 0
  microMeteredExecution:
    targetPrice:
      usdc: "0.001"
      sats: 10
      per: call
    status: illustrative target, not the published charge
  currentPublishedL402:
    standardPaidCallSats: 250
    proof.listSats: 10
    note: Call payment.get_info for current per-tool prices and payment availability.
configSchema:
  type: object
  additionalProperties: false
  properties: {}
exampleConfig: {}